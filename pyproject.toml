[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocontent"
version = "0.1.0"
description = "自動コンテンツ準備パイプライン — RSSやWebから記事を収集し、下書きを自動生成するシステム"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.0",
    "apscheduler>=3.10.4",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
autocontent = "autocontent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autocontent"]

[tool.ruff]
line-length = 100
target-version = "py311"
