<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Madagascar Roulette</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  #canvas { display: block; }
  #ui {
    position: absolute; top: 16px; left: 16px;
    background: rgba(0,0,0,0.55); padding: 14px 18px; border-radius: 10px;
    backdrop-filter: blur(6px); user-select: none; line-height: 1.6;
  }
  #ui h1 { margin: 0 0 6px; font-size: 18px; }
  #ui small { color: #aaa; }
  #status { font-weight: bold; min-height: 1.4em; }
  #result {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 48px; font-weight: bold; text-shadow: 0 2px 8px #000;
    opacity: 0; transition: opacity 0.4s; pointer-events: none;
  }
  #result.show { opacity: 1; }
  button {
    margin-top: 8px; padding: 6px 14px; border-radius: 6px;
    border: 1px solid #888; background: #222; color: #fff; cursor: pointer;
  }
  button:hover { background: #333; }
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.4); border-radius: 50%;
    transform: translate(-50%, -50%); pointer-events: none;
  }
</style>
</head>
<body>
<div id="ui">
  <h1>🌍 Madagascar Roulette</h1>
  <div>回転する地球儀をクリックして<br><b>マダガスカル</b>を狙え！</div>
  <div style="margin-top:8px">スコア: <span id="score">0</span> / 試行: <span id="attempts">0</span></div>
  <div id="status">クリックしてSPIN！</div>
  <button id="reset">リセット</button>
  <label style="display:block;margin-top:6px;font-size:12px;">
    <input type="checkbox" id="hint"> マダガスカルをハイライト (練習モード)
  </label>
  <small>ドラッグで視点回転 / ホイールでズーム</small>
</div>
<div id="result"></div>
<canvas id="canvas"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MADAGASCAR = { latMin: -25.7, latMax: -11.9, lngMin: 43.2, lngMax: 50.5 };

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000010);

// stars
const starGeom = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 2000; i++) {
  const r = 50;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}
starGeom.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 0.08 })));

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 3.2);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 1.6;
controls.maxDistance = 8;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(5, 3, 5);
scene.add(sun);

const RADIUS = 1;
const loader = new THREE.TextureLoader();
const earthTex = loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
earthTex.colorSpace = THREE.SRGBColorSpace;

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS, 64, 64),
  new THREE.MeshPhongMaterial({ map: earthTex, shininess: 8 })
);
scene.add(globe);

// Madagascar highlight ring (toggleable)
const hintGroup = new THREE.Group();
hintGroup.visible = false;
scene.add(hintGroup);
{
  const corners = [
    [MADAGASCAR.latMin, MADAGASCAR.lngMin],
    [MADAGASCAR.latMin, MADAGASCAR.lngMax],
    [MADAGASCAR.latMax, MADAGASCAR.lngMax],
    [MADAGASCAR.latMax, MADAGASCAR.lngMin],
    [MADAGASCAR.latMin, MADAGASCAR.lngMin],
  ];
  const pts = corners.map(([lat, lng]) => latLngToVec3(lat, lng, RADIUS * 1.005));
  const geom = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geom, new THREE.LineBasicMaterial({ color: 0xff3355 }));
  globe.add(line); // attach to globe so it spins with it
}

// Marker for last click
const marker = new THREE.Mesh(
  new THREE.SphereGeometry(0.02, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffff00 })
);
marker.visible = false;
globe.add(marker);

// lat/lng <-> vec3 (matches Three.js SphereGeometry default UV with equirectangular texture
// where u=0.5 is Greenwich (lng=0))
function latLngToVec3(latDeg, lngDeg, r = RADIUS) {
  const phi = (90 - latDeg) * Math.PI / 180;
  const u = (lngDeg + 180) / 360;
  const theta = u * 2 * Math.PI;
  const x = -r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.cos(phi);
  const z = r * Math.sin(phi) * Math.sin(theta);
  return new THREE.Vector3(x, y, z);
}

function vec3ToLatLng(v) {
  const r = v.length();
  const lat = 90 - Math.acos(v.y / r) * 180 / Math.PI;
  let theta = Math.atan2(v.z, -v.x);
  if (theta < 0) theta += 2 * Math.PI;
  const lng = theta * 180 / Math.PI - 180;
  return { lat, lng };
}

// Game state
let score = 0;
let attempts = 0;
let spinSpeed = 0.01; // rad/frame on Y axis
const scoreEl = document.getElementById('score');
const attemptsEl = document.getElementById('attempts');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

document.getElementById('reset').onclick = () => {
  score = 0; attempts = 0;
  scoreEl.textContent = score;
  attemptsEl.textContent = attempts;
  statusEl.textContent = 'リセット完了！';
  spinSpeed = 0.01;
  marker.visible = false;
  resultEl.classList.remove('show');
};

document.getElementById('hint').onchange = (e) => {
  globe.children.forEach(c => { if (c.type === 'Line') c.visible = e.target.checked; });
};
// initial state: hidden
globe.children.forEach(c => { if (c.type === 'Line') c.visible = false; });

// Click handling
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let dragMoved = false;
let downPos = null;

canvas.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY };
  dragMoved = false;
});
canvas.addEventListener('pointermove', (e) => {
  if (downPos && (Math.abs(e.clientX - downPos.x) > 4 || Math.abs(e.clientY - downPos.y) > 4)) {
    dragMoved = true;
  }
});
canvas.addEventListener('pointerup', (e) => {
  if (dragMoved) { downPos = null; return; }
  downPos = null;
  handleClick(e);
});

function handleClick(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(globe);
  if (hits.length === 0) return;

  const worldPoint = hits[0].point.clone();
  const localPoint = globe.worldToLocal(worldPoint.clone());
  const { lat, lng } = vec3ToLatLng(localPoint);

  attempts++;
  attemptsEl.textContent = attempts;

  marker.position.copy(localPoint).multiplyScalar(1.01);
  marker.visible = true;

  const hit = (lat >= MADAGASCAR.latMin && lat <= MADAGASCAR.latMax &&
               lng >= MADAGASCAR.lngMin && lng <= MADAGASCAR.lngMax);

  const coordStr = `lat ${lat.toFixed(1)}°, lng ${lng.toFixed(1)}°`;
  if (hit) {
    score++;
    scoreEl.textContent = score;
    statusEl.textContent = `🎉 命中！ (${coordStr})`;
    showResult('🎉 MADAGASCAR! 🎉', '#ffdd33');
    spinSpeed = Math.min(0.04, spinSpeed + 0.005); // 難易度UP
  } else {
    // 距離をマダガスカル中心からのざっくり度数で
    const cLat = (MADAGASCAR.latMin + MADAGASCAR.latMax) / 2;
    const cLng = (MADAGASCAR.lngMin + MADAGASCAR.lngMax) / 2;
    const dist = Math.round(Math.hypot(lat - cLat, lng - cLng));
    statusEl.textContent = `はずれ (${coordStr}) — マダガスカルまで約 ${dist}°`;
    showResult('MISS', '#ff5577');
  }
}

function showResult(text, color) {
  resultEl.textContent = text;
  resultEl.style.color = color;
  resultEl.classList.add('show');
  clearTimeout(showResult._t);
  showResult._t = setTimeout(() => resultEl.classList.remove('show'), 1200);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  globe.rotation.y += spinSpeed;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
